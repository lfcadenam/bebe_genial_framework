<!-- Backdrop Oscurecido Sutilmente -->
@if (isOpen) {
  <div
    class="fixed inset-0 bg-slate-900/35 backdrop-blur-xs z-50 transition-opacity"
    (click)="onCancel()"
  ></div>
}

<!-- Modal Centrado Nuvex Modern Curve UI -->
@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto"
  >
    <div
      class="w-full max-w-md bg-white rounded-[32px] shadow-2xl border border-slate-200/80 p-6 sm:p-7 overflow-hidden animate-in zoom-in-95 duration-200"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start gap-4">
        <!-- Badge de Icono Circular / Rounded-2xl según tipo -->
        @if (type === 'danger') {
          <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 border border-rose-100 flex items-center justify-center shrink-0">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </div>
        } @else if (type === 'warning') {
          <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 border border-amber-100 flex items-center justify-center shrink-0">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
        } @else {
          <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center shrink-0">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        }

        <!-- Textos -->
        <div class="min-w-0 flex-1 pt-0.5">
          <h3 class="text-base sm:text-lg font-extrabold text-slate-900 tracking-tight leading-snug">
            {{ title }}
          </h3>
          <p class="text-xs sm:text-sm text-slate-500 mt-1.5 leading-relaxed">
            {{ message }}
          </p>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-end gap-2.5">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isLoading"
          class="px-5 py-2.5 rounded-full text-xs font-bold text-slate-600 hover:text-slate-800 hover:bg-slate-100 transition-colors cursor-pointer disabled:opacity-50"
        >
          {{ cancelText }}
        </button>

        <button
          type="button"
          (click)="onConfirm()"
          [disabled]="isLoading"
          class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-xs font-bold text-white shadow-md active:scale-95 transition-all cursor-pointer disabled:opacity-50"
          [ngClass]="type === 'danger' ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-600/25' : (type === 'warning' ? 'bg-amber-600 hover:bg-amber-700 shadow-amber-600/25' : 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-500/25')"
        >
          @if (isLoading) {
            <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          }
          <span>{{ confirmText }}</span>
        </button>
      </div>
    </div>
  </div>
}
