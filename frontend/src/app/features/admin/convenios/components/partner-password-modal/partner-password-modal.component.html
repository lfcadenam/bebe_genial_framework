<!-- Backdrop Oscurecido Sutilmente -->
@if (isOpen) {
  <div
    class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs z-50 transition-opacity"
    (click)="onClose()"
  ></div>
}

<!-- Modal Centrado Nuvex Modern Curve UI -->
@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto"
  >
    <div
      class="w-full max-w-md bg-white rounded-[32px] shadow-2xl border border-slate-200/80 overflow-hidden animate-in zoom-in-95 duration-200"
      (click)="$event.stopPropagation()"
    >
      <!-- Cabecera -->
      <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-700 border border-amber-100 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
          </div>
          <div>
            <h3 class="text-base font-extrabold text-slate-900 leading-tight">
              Restablecer Contraseña
            </h3>
            <p class="text-xs text-slate-400">
              {{ partner?.company_name }}
            </p>
          </div>
        </div>
        <button
          type="button"
          (click)="onClose()"
          class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors cursor-pointer"
          title="Cerrar ventana"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Contenido Formulario -->
      <form (ngSubmit)="onSubmit()" class="p-6 space-y-4">
        <!-- Error -->
        @if (errorMessage()) {
          <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-semibold flex items-center gap-2">
            <svg class="w-4 h-4 text-rose-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <p class="text-xs text-slate-500 leading-relaxed">
          Ingresa una nueva contraseña para la cuenta del distribuidor (<strong>{{ partner?.contact_email }}</strong>) o haz clic en "Generar Clave Segura".
        </p>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-700">Nueva Contraseña <span class="text-rose-500">*</span></label>
          <div class="flex items-center gap-2">
            <input
              type="text"
              name="newPassword"
              [(ngModel)]="newPassword"
              required
              minlength="6"
              placeholder="Ej: AccesoSeguro2026*"
              class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 border border-slate-200 text-slate-800 font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
            />
            <button
              type="button"
              (click)="generateRandomPassword()"
              class="px-3 py-2.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors shrink-0 cursor-pointer"
              title="Generar contraseña aleatoria"
            >
              Generar
            </button>
          </div>
        </div>

        <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2.5">
          <button
            type="button"
            (click)="onClose()"
            class="px-4 py-2 rounded-full text-xs font-bold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="isSaving() || !newPassword || newPassword.length < 6"
            class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-xs font-bold text-white bg-emerald-500 hover:bg-emerald-600 shadow-md shadow-emerald-500/25 active:scale-95 transition-all disabled:opacity-50 cursor-pointer"
          >
            @if (isSaving()) {
              <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
            }
            <span>{{ isSaving() ? 'Guardando...' : 'Actualizar Clave' }}</span>
          </button>
        </div>
      </form>
    </div>
  </div>
}
